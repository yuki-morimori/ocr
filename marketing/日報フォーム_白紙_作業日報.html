<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作業日報（記入用・白紙）</title>
<style>
  @page { size: A4 portrait; margin: 12mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; color:#13263f; }
  .sheet { width: 186mm; margin: 0 auto; }
  h1 { text-align:center; font-size: 24px; letter-spacing:.3em; margin: 2mm 0 4mm; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1.2px solid #13263f; padding: 5px 7px; font-size: 13px; }
  .lbl { background:#eef2f7; font-weight:700; white-space:nowrap; text-align:center; width: 22mm; }
  .top td { height: 12mm; }
  .work th { background:#13263f; color:#fff; text-align:center; }
  .work td { height: 9mm; text-align:center; }
  .work .nm { text-align:left; }
  .num { width: 18mm; }
  .no { width: 10mm; }
  /* 経費欄：崩れないよう固定グリッド */
  .cost { margin-top: 4mm; }
  .cost th { background:#eef2f7; text-align:center; width: 25%; }
  .cost td { text-align:right; height: 11mm; width: 25%; }
  .cost .yen::after { content:"円"; color:#6b7785; font-size:11px; margin-left:2px; }
  .note td { height: 18mm; vertical-align: top; }
  .foot { text-align:center; color:#6b7785; font-size:11px; margin-top: 4mm; }
  .foot b{ color:#1f3a5f; }
</style>
</head>
<body>
<div class="sheet">
  <h1>作 業 日 報</h1>

  <table class="top">
    <tr>
      <td class="lbl">日付</td><td>　　　年　　月　　日（　）</td>
      <td class="lbl">天候</td><td>　　　　　</td>
    </tr>
    <tr>
      <td class="lbl">元請</td><td colspan="3"></td>
    </tr>
    <tr>
      <td class="lbl">現場名</td><td colspan="3"></td>
    </tr>
    <tr>
      <td class="lbl">作業内容</td><td colspan="3"></td>
    </tr>
  </table>

  <table class="work" style="margin-top:4mm">
    <thead>
      <tr><th class="no">No</th><th>氏名</th><th class="num">人工</th><th class="num">早出・残業(h)</th></tr>
    </thead>
    <tbody>
      <!-- 10名分 -->
      <tr><td>1</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>2</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>3</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>4</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>5</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>6</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>7</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>8</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>9</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td>10</td><td class="nm"></td><td></td><td></td></tr>
      <tr><td class="lbl" colspan="2" style="text-align:right">計</td><td></td><td></td></tr>
    </tbody>
  </table>

  <!-- 経費欄（固定グリッドで崩れない） -->
  <table class="cost">
    <tr>
      <th>高速代</th><th>駐車代</th><th>その他</th><th>経費 合計</th>
    </tr>
    <tr>
      <td class="yen"></td><td class="yen"></td><td class="yen"></td><td class="yen"></td>
    </tr>
  </table>

  <table class="note" style="margin-top:4mm">
    <tr><td class="lbl">備考</td><td></td></tr>
  </table>

  <div class="foot">作業日報OCR <b>『うつして台帳』</b>　手書きはそのまま、撮るだけで集計・請求書・給料明細に。</div>
</div>
</body>
</html>
